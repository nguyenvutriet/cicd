name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: commit SHA đầy đủ của image cũ (để trống = build mới)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/student-web-core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # StudentWebCoreApplicationTests cần database thật nên được loại ra
      - name: Run unit tests
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dtest='!StudentWebCoreApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

  build-push:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: backend/student-web-core
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/student-web-core:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/student-web-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    # Chạy khi build thành công, hoặc khi rollback (build bị bỏ qua)
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.build-push.result == 'success' ||
      (inputs.image_tag && needs.build-push.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Upload app.env to EC2
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "$BACKEND_ENV_FILE" || { echo "Thieu secret BACKEND_ENV_FILE"; exit 1; }
          install -m 600 /dev/null key.pem
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > key.pem
          printf '%s\n' "$BACKEND_ENV_FILE" | ssh -i key.pem -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" \
            'umask 077; mkdir -p ~/student-web && cat > ~/student-web/app.env.tmp && mv ~/student-web/app.env.tmp ~/student-web/app.env'
          rm -f key.pem

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-web-core:${{ inputs.image_tag || github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          command_timeout: 10m
          script: |
            set -eu
            APP=student-web
            ENV_FILE="$HOME/student-web/app.env"
            test -f "$ENV_FILE" || { echo "Thieu file $ENV_FILE"; exit 1; }

            docker pull "$IMAGE"
            docker network inspect appnet >/dev/null 2>&1 || docker network create appnet
            PREVIOUS=$(docker inspect -f '{{.Config.Image}}' "$APP" 2>/dev/null || true)

            start_app() {
              docker rm -f "$APP" >/dev/null 2>&1 || true
              docker run -d --name "$APP" \
                --restart unless-stopped \
                --network appnet \
                -p 127.0.0.1:8080:8080 \
                --env-file "$ENV_FILE" \
                --log-opt max-size=10m --log-opt max-file=3 \
                "$1"
            }

            start_app "$IMAGE"

            echo "Cho ung dung khoi dong (toi da 3 phut)..."
            for i in $(seq 1 36); do
              if curl -fs http://127.0.0.1:8080/actuator/health >/dev/null; then
                echo "Deploy thanh cong: $IMAGE"
                docker image prune -af --filter "until=168h"
                exit 0
              fi
              sleep 5
            done

            echo "Health check that bai. Log cua container:"
            docker logs --tail 150 "$APP" || true
            if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$IMAGE" ]; then
              echo "Rollback ve $PREVIOUS"
              start_app "$PREVIOUS"
            fi
            exit 1