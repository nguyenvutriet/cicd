spring.application.name=student-web-core

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=14400000
spring.app.jwtCookieName=${JWT_COOKIE_NAME}
app.auth.expose-jwt=false

frontend.url=${FRONTEND_URL}

management.endpoints.web.exposure.include=*
management.endpoints.health.show-details=always
management.endpoints.shutdown.enabled=true

info.app.name=${spring.application.name}
info.app.description=This is a student web core application.
info.app.version=1.0.0

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.oauth2.allowed-email-domains=

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.forgot-password.otp-ttl-minutes=5
app.forgot-password.resend-cooldown-seconds=60
app.forgot-password.max-otp-attempts=10
app.forgot-password.reset-token-ttl-minutes=10
app.forgot-password.dev-log-otp=false
